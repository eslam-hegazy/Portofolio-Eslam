<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eslam Hegazy | Senior Software Engineer (Flutter & Java Spring Boot)</title>
  <meta name="description" content="Portfolio of Eslam Hegazy — Senior Software Engineer specializing in high-performance Flutter mobile apps and scalable Java Spring Boot backend systems.">
  <meta name="keywords" content="Eslam Hegazy, Senior Software Engineer, Flutter Developer, Java Spring Boot, Mobile Architect, Backend Architect, FinTech, Healthcare">
  <meta name="author" content="Eslam Hegazy">

  <!-- Open Graph -->
  <meta property="og:title" content="Eslam Hegazy | Senior Software Engineer (Flutter & Java Spring Boot)">
  <meta property="og:description" content="Senior Software Engineer with 4+ years architecting enterprise Flutter apps and scalable Java Spring Boot backend services.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eslam Hegazy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon using Eslam's image -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Native Premium Splash Screen */
    #app-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    #app-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .loader-avatar-ring {
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #3B82F6;
      border-right-color: #60A5FA;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .loader-avatar-pulse {
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      animation: pulse 2s ease-in-out infinite;
    }

    .loader-avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      z-index: 1;
    }

    .loader-name {
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin: 0 0 6px 0;
      text-align: center;
    }

    .loader-subtitle {
      color: #94A3B8;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.08em;
      margin: 0 0 24px 0;
      text-align: center;
    }

    .loader-bar-bg {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar-fill {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #3B82F6, #93C5FD, transparent);
      animation: progress 1.5s ease-in-out infinite;
      border-radius: 99px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }

    @keyframes progress {
      0% { left: -100%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <!-- Native Instant Loader -->
  <div id="app-loader">
    <div class="loader-avatar-wrapper">
      <div class="loader-avatar-pulse"></div>
      <div class="loader-avatar-ring"></div>
      <img src="favicon.png" alt="Eslam Hegazy" class="loader-avatar">
    </div>
    <h1 class="loader-name">Eslam Hegazy</h1>
    <p class="loader-subtitle">Senior Software Engineer</p>
    <div class="loader-bar-bg">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <script>
    function removeLoader() {
      const loader = document.getElementById('app-loader');
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 450);
      }
    }

    window.addEventListener('flutter-first-frame', removeLoader);

    // Fallback: observe DOM for flutter-view mounting
    const observer = new MutationObserver(function(mutations) {
      for (let i = 0; i < mutations.length; i++) {
        const added = mutations[i].addedNodes;
        for (let j = 0; j < added.length; j++) {
          const node = added[j];
          if (node.tagName && (node.tagName.toLowerCase() === 'flutter-view' || node.tagName.toLowerCase() === 'flt-glass-pane')) {
            setTimeout(removeLoader, 200);
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout: ensure loader never blocks screen if anything delays
    setTimeout(removeLoader, 10000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
